[versions]
adventure = "4.26.1" # https://mvnrepository.com/artifact/net.kyori/adventure-api
paper-api = "1.21.11-R0.1-SNAPSHOT" # https://repo.papermc.io/ui/packages?name=io.papermc.paper%3Apaper-api&type=packages
shadow = "9.3.2" # https://plugins.gradle.org/plugin/com.gradleup.shadow
dotenv = "4.0.0" # https://plugins.gradle.org/plugin/co.uzzu.dotenv.gradle
jspecify = "1.0.0" # https://mvnrepository.com/artifact/org.jspecify/jspecify

[libraries]
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
dotenv = { id = "co.uzzu.dotenv.gradle", version.ref = "dotenv" }
