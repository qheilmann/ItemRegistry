name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin JAR
        run: ./gradlew :itemregistry-plugin:shadowJar

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v3
        with:
          files: itemregistry-plugin/build/libs/itemregistry-*.jar
